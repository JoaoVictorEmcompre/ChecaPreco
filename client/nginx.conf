server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # arquivos com hash do Vite: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache (garante que o deploy novo aparece)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota do React Router (ex.: /Login) cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
